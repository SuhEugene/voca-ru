<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voca-ru на чистом JavaScript</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
  select, button, textarea { font: inherit; padding: .3rem .5rem; max-width: 100%; box-sizing: border-box; }
  textarea { width: 100%; }
  pre { white-space: pre-wrap; background: #8881; padding: .75rem; border-radius: .4rem; font-size: 13px; }
</style>

<h1>voca-ru на чистом JavaScript</h1>
<p>Русский синтез речи: 4,5 млн параметров, один файл GGUF, без библиотек и сборки.</p>
<p>
  <textarea id="typing" rows="4" cols="50">Привет! Как дела? Сегодня хорошая погода, и я очень рад.</textarea>
</p>
<p>
  <select id="voice"></select>
  <button id="play">Произнести</button>
  <button id="measure">Измерить скорость</button>
  <a id="save" download="voca-ru.wav" hidden>Сохранить WAV</a>
</p>
<pre id="log">Загрузка…</pre>

<script type="module">
const query = new URLSearchParams(location.search);
const { readGGUF, TinyVoca, spent } = await import(query.get("script") || "./tiny-voca.js");
const { fromGGUF } = await import("./ru/index.js");
const { utterancesOf, limited, wav } = await import("./text.js");
const url = query.get("file") || "https://huggingface.co/SuhEugene/voca-ru/resolve/main/gguf/voca-ru-js.gguf";
const $ = (id) => document.getElementById(id);
const typing = $("typing");
const log = (text) => { $("log").textContent = text; };
const paint = () => new Promise((done) => setTimeout(done, 20));

let voca, phonemizer, ready;
async function load() {
  if (voca) return;
  log(`Скачиваю ${url}`);
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url}: ${response.status}`);
  const buffer = await response.arrayBuffer();
  const downloaded = performance.now();
  log("Читаю файл…");
  await paint();
  const file = readGGUF(buffer);
  voca = new TinyVoca(file);
  phonemizer = fromGGUF(file);
  $("voice").replaceChildren(...voca.voices.map((name) => new Option(name, name, false, name === "F2")));
  window.loaded = { download: downloaded, ready: performance.now() - downloaded };
  ready = `${(buffer.byteLength / 1e6).toFixed(1)} МБ. Готово через ${window.loaded.ready.toFixed(0)} мс после скачивания.`;
  log(ready);
}

let context, sources = [], run = 0;
$("play").onclick = async () => {
  context ||= new AudioContext();
  const mine = ++run, clicked = performance.now();
  sources.forEach((source) => source.stop());
  sources = [];
  $("save").hidden = true;
  await load();
  if (mine !== run) return;
  let utterances;
  try {
    utterances = utterancesOf(typing.value, phonemizer, voca.config.max_tokens - 12);
  } catch (error) {
    log(`${ready}\n${error.message}`);
    return;
  }
  if (!utterances.length) { log(`${ready}\nНечего произносить.`); return; }
  log(`${ready}\nГоворю…`);
  await paint();
  const rate = voca.config.sample_rate, chunks = [], lines = [];
  let next = 0, work = 0;
  for (const [seed, { ids, stress, phonemes }] of utterances.entries()) {
    const started = performance.now();
    let audio;
    try {
      ({ audio } = voca.synthesize(ids, stress, { voice: $("voice").value, seed }));
    } catch (error) {
      log(`${ready}\n${error.message}`);
      return;
    }
    work += (performance.now() - started) / 1000;
    if (mine !== run) return;
    chunks.push(audio);
    const heard = limited(audio), sound = context.createBuffer(1, heard.length, rate), source = context.createBufferSource();
    sound.copyToChannel(heard, 0);
    source.buffer = sound;
    source.connect(context.destination);
    next = Math.max(next, context.currentTime + 0.05);
    source.start(next);
    window.first ??= { sinceClick: performance.now() - clicked, sinceOpen: performance.now() };
    next += heard.length / rate;
    sources.push(source);
    lines.push(phonemes);
    log(`${ready}\nПредложение ${seed + 1} из ${utterances.length}\n\n${lines.join("\n")}`);
    await paint();
    if (mine !== run) return;
  }
  const whole = new Float32Array(chunks.reduce((sum, chunk) => sum + chunk.length, 0));
  chunks.reduce((at, chunk) => (whole.set(chunk, at), at + chunk.length), 0);
  URL.revokeObjectURL($("save").href);
  $("save").href = URL.createObjectURL(new Blob([wav(limited(whole), rate)], { type: "audio/wav" }));
  $("save").hidden = false;
  const seconds = whole.length / rate;
  log(`${ready}\n${seconds.toFixed(2)} с аудио за ${work.toFixed(2)} с: ${(seconds / work).toFixed(1)} раз быстрее реального времени.` +
      `\n\n${lines.join("\n")}`);
};

async function measure() {
  await load();
  for (const name in spent) delete spent[name];
  const utterances = utterancesOf(typing.value, phonemizer, voca.config.max_tokens - 12);
  const lines = [];
  let audioSeconds = 0, workSeconds = 0, number = 0;
  for (const { ids, stress } of utterances) {
    number++;
    for (const voice of voca.voices) {
      let best = Infinity, audio;
      for (let run = 0; run < 3; run++) {
        const started = performance.now();
        ({ audio } = voca.synthesize(ids, stress, { voice }));
        best = Math.min(best, (performance.now() - started) / 1000);
      }
      const seconds = audio.length / voca.config.sample_rate;
      audioSeconds += seconds;
      workSeconds += best;
      lines.push(`предложение ${number}, голос ${voice}: ${seconds.toFixed(2)} с за ${best.toFixed(2)} с = ${(seconds / best).toFixed(1)}x`);
      log(lines.join("\n"));
      await paint();
    }
  }
  const total = Object.values(spent).reduce((a, b) => a + b, 0);
  const parts = Object.entries(spent).sort((a, b) => b[1] - a[1]).map(([name, ms]) => `${name} ${(100 * ms / total).toFixed(0)}%`).join(", ");
  const summary = `${audioSeconds.toFixed(1)} с аудио за ${workSeconds.toFixed(2)} с = ${(audioSeconds / workSeconds).toFixed(1)} раз быстрее реального времени`;
  log([...lines, "", summary, "где время: " + parts].join("\n"));
  window.result = { speed: audioSeconds / workSeconds, summary, parts };
}
$("measure").onclick = measure;
await load();
if (query.has("first")) {
  await $("play").onclick();
}
</script>
