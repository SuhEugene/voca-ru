[package]
name = "tiny-voca"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust port of tiny-voca, a 4.5M-parameter English text-to-speech model"

[features]
default = ["accelerate"]
# Use Apple's Accelerate BLAS for matrix products on macOS (ignored elsewhere).
accelerate = []

[dependencies]
dizione = { path = "../dizione" }
matrixmultiply = "0.3"
rayon = "1"
realfft = "3"
serde_json = "1"

[lints.cargo]
# matrixmultiply is the fallback backend; unused when Accelerate is compiled in.
unused_dependencies = "allow"
